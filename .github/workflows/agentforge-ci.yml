name: AgentForge .NET CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "benchmarks/**"
      - "docs/**"
      - "AgentForge.sln"
      - "Directory.Build.props"
      - "global.json"
      - "AGENTFORGE_SPEC.md"
      - "README.md"
      - ".github/workflows/agentforge-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "benchmarks/**"
      - "docs/**"
      - "AgentForge.sln"
      - "Directory.Build.props"
      - "global.json"
      - "AGENTFORGE_SPEC.md"
      - "README.md"
      - ".github/workflows/agentforge-ci.yml"
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: "Run the fast smoke benchmark or the full 30-seed experiment"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

concurrency:
  group: agentforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and pack (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: dotnet restore AgentForge.sln

      - name: Build
        run: dotnet build AgentForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgentForge.sln --configuration Release --no-build --no-restore

      - name: Build and smoke-test bandit benchmarks
        run: dotnet run --project benchmarks/AgentForge.Benchmarks/AgentForge.Benchmarks.csproj --configuration Release -- --output artifacts/benchmark-smoke

      - name: Verify benchmark output
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          raw = list(csv.DictReader(Path("artifacts/benchmark-smoke/stationary-bandit-runs.csv").open()))
          summary = list(csv.DictReader(Path("artifacts/benchmark-smoke/stationary-bandit-summary.csv").open()))
          assert len(raw) == 36, f"Expected 36 benchmark runs, got {len(raw)}"
          assert len(summary) == 18, f"Expected 18 summary rows, got {len(summary)}"
          assert {row["algorithm"] for row in raw} == {"EpsilonGreedy", "ThompsonSampling"}
          assert len({(row["arm_count"], row["difficulty"]) for row in raw}) == 9
          for row in raw:
              assert float(row["cumulative_pseudo_regret"]) >= 0
              assert 0 <= float(row["optimal_action_rate"]) <= 1
          contextual = list(csv.DictReader(Path("artifacts/benchmark-smoke/contextual-bandit-runs.csv").open()))
          contextual_summary = list(csv.DictReader(Path("artifacts/benchmark-smoke/contextual-bandit-summary.csv").open()))
          assert len(contextual) == 4, f"Expected 4 contextual smoke runs, got {len(contextual)}"
          assert len(contextual_summary) == 2, f"Expected 2 contextual summary rows, got {len(contextual_summary)}"
          assert {row["algorithm"] for row in contextual} == {"LinUCB", "LinearThompsonSampling"}
          for row in contextual:
              assert float(row["cumulative_pseudo_regret"]) >= -1e-8
              assert 0 <= float(row["optimal_action_rate"]) <= 1
          print("Verified stationary and contextual bandit smoke outputs.")
          PY

      - name: Pack agent modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          for project in \
            src/AgentForge.Abstractions/AgentForge.Abstractions.csproj \
            src/AgentForge.Tools/AgentForge.Tools.csproj \
            src/AgentForge.Models/AgentForge.Models.csproj \
            src/AgentForge.Agents.SimpleReflex.Domain/AgentForge.Agents.SimpleReflex.Domain.csproj \
            src/AgentForge.Agents.SimpleReflex.Application/AgentForge.Agents.SimpleReflex.Application.csproj \
            src/AgentForge.Agents.SimpleReflex/AgentForge.Agents.SimpleReflex.csproj \
            src/AgentForge.Agents.ModelBasedReflex.Domain/AgentForge.Agents.ModelBasedReflex.Domain.csproj \
            src/AgentForge.Agents.ModelBasedReflex.Application/AgentForge.Agents.ModelBasedReflex.Application.csproj \
            src/AgentForge.Agents.ModelBasedReflex/AgentForge.Agents.ModelBasedReflex.csproj \
            src/AgentForge.Agents.UtilityBased.Domain/AgentForge.Agents.UtilityBased.Domain.csproj \
            src/AgentForge.Agents.UtilityBased.Application/AgentForge.Agents.UtilityBased.Application.csproj \
            src/AgentForge.Agents.UtilityBased/AgentForge.Agents.UtilityBased.csproj \
            src/AgentForge.Agents.GoalBased.Domain/AgentForge.Agents.GoalBased.Domain.csproj \
            src/AgentForge.Agents.GoalBased.Application/AgentForge.Agents.GoalBased.Application.csproj \
            src/AgentForge.Agents.GoalBased/AgentForge.Agents.GoalBased.csproj \
            src/AgentForge.Agents.Learning.Domain/AgentForge.Agents.Learning.Domain.csproj \
            src/AgentForge.Agents.Learning.Application/AgentForge.Agents.Learning.Application.csproj \
            src/AgentForge.Agents.Learning/AgentForge.Agents.Learning.csproj \
            src/AgentForge.Agents.ReAct/AgentForge.Agents.ReAct.csproj \
            src/AgentForge.Agents.Planning/AgentForge.Agents.Planning.csproj \
            src/AgentForge.Agents.Reflection/AgentForge.Agents.Reflection.csproj
          do
            dotnet pack "$project" --configuration Release --no-build --no-restore --output artifacts/packages
          done

      - name: Verify NuGet package dependency graph and readmes
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          expected_dependencies = {
              "AgentForge.Abstractions": set(),
              "AgentForge.Tools": {"AgentForge.Abstractions"},
              "AgentForge.Models": {"AgentForge.Tools"},
              "AgentForge.Agents.SimpleReflex.Domain": set(),
              "AgentForge.Agents.SimpleReflex.Application": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.SimpleReflex.Domain",
              },
              "AgentForge.Agents.SimpleReflex": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.SimpleReflex.Application",
                  "AgentForge.Agents.SimpleReflex.Domain",
              },
              "AgentForge.Agents.ModelBasedReflex.Domain": set(),
              "AgentForge.Agents.ModelBasedReflex.Application": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.ModelBasedReflex.Domain",
              },
              "AgentForge.Agents.ModelBasedReflex": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.ModelBasedReflex.Application",
                  "AgentForge.Agents.ModelBasedReflex.Domain",
              },
              "AgentForge.Agents.UtilityBased.Domain": set(),
              "AgentForge.Agents.UtilityBased.Application": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.UtilityBased.Domain",
              },
              "AgentForge.Agents.UtilityBased": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.UtilityBased.Application",
                  "AgentForge.Agents.UtilityBased.Domain",
              },
              "AgentForge.Agents.GoalBased.Domain": set(),
              "AgentForge.Agents.GoalBased.Application": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.GoalBased.Domain",
              },
              "AgentForge.Agents.GoalBased": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.GoalBased.Application",
                  "AgentForge.Agents.GoalBased.Domain",
              },
              "AgentForge.Agents.Learning.Domain": set(),
              "AgentForge.Agents.Learning.Application": {
                  "AgentForge.Agents.Learning.Domain",
              },
              "AgentForge.Agents.Learning": {
                  "AgentForge.Abstractions",
                  "AgentForge.Agents.Learning.Application",
                  "AgentForge.Agents.Learning.Domain",
              },
              "AgentForge.Agents.ReAct": {
                  "AgentForge.Abstractions",
                  "AgentForge.Models",
                  "AgentForge.Tools",
              },
              "AgentForge.Agents.Planning": {"AgentForge.Abstractions"},
              "AgentForge.Agents.Reflection": {"AgentForge.Abstractions"},
          }

          public_agent_packages = {
              "AgentForge.Agents.SimpleReflex",
              "AgentForge.Agents.ModelBasedReflex",
              "AgentForge.Agents.UtilityBased",
              "AgentForge.Agents.GoalBased",
              "AgentForge.Agents.Learning",
              "AgentForge.Agents.ReAct",
              "AgentForge.Agents.Planning",
              "AgentForge.Agents.Reflection",
          }

          packages_by_id = {}
          for package_path in map(Path, glob.glob("artifacts/packages/*.nupkg")):
              with zipfile.ZipFile(package_path) as package:
                  nuspec_name = next(
                      name for name in package.namelist()
                      if name.endswith(".nuspec")
                  )
                  nuspec = ET.fromstring(package.read(nuspec_name))
                  package_id_node = next(
                      node for node in nuspec.iter()
                      if node.tag.rsplit("}", 1)[-1] == "id"
                  )
                  package_id = package_id_node.text
                  packages_by_id.setdefault(package_id, []).append(package_path)

          for package_id, expected in expected_dependencies.items():
              matches = packages_by_id.get(package_id, [])
              assert len(matches) == 1, (
                  f"Expected one package with nuspec id {package_id}, found {matches}"
              )

              with zipfile.ZipFile(matches[0]) as package:
                  entries = set(package.namelist())
                  nuspec_name = next(
                      name for name in entries if name.endswith(".nuspec")
                  )
                  nuspec = ET.fromstring(package.read(nuspec_name))
                  dependencies = {
                      node.attrib["id"]
                      for node in nuspec.iter()
                      if node.tag.rsplit("}", 1)[-1] == "dependency"
                      and "id" in node.attrib
                  }
                  assert dependencies == expected, (
                      f"{package_id} dependency mismatch. "
                      f"Expected {sorted(expected)}, got {sorted(dependencies)}"
                  )

                  if package_id in public_agent_packages:
                      assert "README.md" in entries, (
                          f"{package_id} does not contain README.md"
                      )
                      readme_element = next(
                          (
                              node for node in nuspec.iter()
                              if node.tag.rsplit("}", 1)[-1] == "readme"
                          ),
                          None,
                      )
                      assert readme_element is not None and readme_element.text == "README.md", (
                          f"{package_id} does not declare README.md in its nuspec"
                      )
                      markdown = package.read("README.md").decode("utf-8")
                      assert "## Quick Start" in markdown, (
                          f"{package_id} is missing Quick Start"
                      )
                      assert "```csharp" in markdown, (
                          f"{package_id} is missing a C# code example"
                      )

              print(f"Verified package dependency graph: {package_id}")

          print(
              f"Verified {len(expected_dependencies)} package manifests and "
              f"{len(public_agent_packages)} public agent package READMEs."
          )
          PY

      - name: Verify single-package consumer installation
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"

          cat > "$consumer_dir/PackageConsumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="AgentForge.Agents.SimpleReflex" Version="1.0.0" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$consumer_dir/Program.cs" <<'EOF'
          using AgentForge.Agents.SimpleReflex.Builders;

          var agent = SimpleReflexAgentBuilder
              .Create<ThermostatPercept, ThermostatAction>()
              .When(
                  "too-hot",
                  percept => percept.TemperatureCelsius > percept.TargetCelsius + 1,
                  ThermostatAction.Cool)
              .Build();

          var result = await agent.RunAsync(new ThermostatPercept(29, 22));
          if (result.Output?.Decision.HasAction != true
              || result.Output.Decision.Action != ThermostatAction.Cool)
          {
              throw new InvalidOperationException("The packaged Simple Reflex agent returned an unexpected decision.");
          }

          public sealed record ThermostatPercept(double TemperatureCelsius, double TargetCelsius);

          public enum ThermostatAction
          {
              Cool,
              Heat
          }
          EOF

          dotnet restore "$consumer_dir/PackageConsumer.csproj" --source "$GITHUB_WORKSPACE/artifacts/packages"
          dotnet run --project "$consumer_dir/PackageConsumer.csproj" --configuration Release --no-restore

  full-benchmarks:
    name: Full reproducible bandit benchmarks
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore benchmark project
        run: dotnet restore benchmarks/AgentForge.Benchmarks/AgentForge.Benchmarks.csproj

      - name: Run full benchmark suite
        run: dotnet run --project benchmarks/AgentForge.Benchmarks/AgentForge.Benchmarks.csproj --configuration Release --no-restore -- --full --output artifacts/full-benchmarks

      - name: Verify full benchmark output
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path("artifacts/full-benchmarks")
          stationary = list(csv.DictReader((root / "stationary-bandit-runs.csv").open()))
          stationary_summary = list(csv.DictReader((root / "stationary-bandit-summary.csv").open()))
          contextual = list(csv.DictReader((root / "contextual-bandit-runs.csv").open()))
          contextual_summary = list(csv.DictReader((root / "contextual-bandit-summary.csv").open()))

          assert len(stationary) == 540, f"Expected 540 stationary runs, got {len(stationary)}"
          assert len(stationary_summary) == 18, f"Expected 18 stationary summary rows, got {len(stationary_summary)}"
          assert len(contextual) == 60, f"Expected 60 contextual runs, got {len(contextual)}"
          assert len(contextual_summary) == 2, f"Expected 2 contextual summary rows, got {len(contextual_summary)}"
          assert {row["algorithm"] for row in stationary} == {"EpsilonGreedy", "ThompsonSampling"}
          assert {row["algorithm"] for row in contextual} == {"LinUCB", "LinearThompsonSampling"}
          for row in stationary + contextual:
              assert float(row["cumulative_pseudo_regret"]) >= -1e-8
              assert 0 <= float(row["optimal_action_rate"]) <= 1
          print("Verified full benchmark outputs: 540 stationary runs and 60 contextual runs.")
          PY

      - name: Upload full benchmark CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-full-bandit-benchmarks
          path: artifacts/full-benchmarks/*.csv
          if-no-files-found: error
          retention-days: 30
