name: AgentForge .NET CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "docs/**"
      - "AgentForge.sln"
      - "Directory.Build.props"
      - "global.json"
      - "AGENTFORGE_SPEC.md"
      - "README.md"
      - ".github/workflows/agentforge-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "docs/**"
      - "AgentForge.sln"
      - "Directory.Build.props"
      - "global.json"
      - "AGENTFORGE_SPEC.md"
      - "README.md"
      - ".github/workflows/agentforge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: dotnet restore AgentForge.sln

      - name: Build
        run: dotnet build AgentForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgentForge.sln --configuration Release --no-build --no-restore
